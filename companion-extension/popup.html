<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { width: 280px; margin: 0; font: 13px/1.45 system-ui, sans-serif; padding: 14px; background: #12141b; color: #eef3fc; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { margin: 0 0 10px; color: #9fb0c8; font-size: 12px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #33405a; background: #0c0f16; color: #eef3fc; font-size: 14px; letter-spacing: .04em; }
  button { margin-top: 8px; width: 100%; padding: 8px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
  .primary { background: linear-gradient(135deg, #7bdcff, #b28cff); color: #06121a; }
  .ghost { background: transparent; color: #9fb0c8; border: 1px solid #33405a; }
  .status { margin-top: 10px; font-size: 12px; }
  .ok { color: #7bffb3; }
  .err { color: #ff9d9d; }
  .hide { display: none; }
</style>
</head>
<body>
  <h1>YT Deck Player Companion</h1>
  <p id="hint">Open the deck's account card, turn on in-deck age-restricted playback, and paste the code it shows.</p>

  <div id="pairBox">
    <input id="code" placeholder="47615-483920" autocomplete="off" spellcheck="false" />
    <button id="pairBtn" class="primary">Pair with the deck</button>
  </div>

  <div id="pairedBox" class="hide">
    <div class="status ok">Paired. Age-restricted tracks can now play inside the deck.</div>
    <button id="unpairBtn" class="ghost">Unpair</button>
  </div>

  <div id="msg" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
